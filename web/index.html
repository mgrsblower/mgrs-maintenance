<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MGRS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MGRS</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading-indicator" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; z-index: 99999;">
    <img src="icons/Icon-192.png" width="56" height="56" style="border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); margin-bottom: 16px;" alt="MGRS">
    <div style="font-size: 16px; font-weight: 700; color: #0F172A; margin-bottom: 6px;">MGRS</div>
    <div style="font-size: 13px; color: #64748B; margin-bottom: 20px;">Memuat aplikasi sistem...</div>
    <div style="width: 36px; height: 36px; border: 3px solid #E2E8F0; border-top-color: #147CC1; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </div>
  <script>
    function removeLoadingIndicator() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.transition = 'opacity 0.25s ease-out';
        loader.style.pointerEvents = 'none';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 250);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoadingIndicator);

    // Backup observer jika event flutter-first-frame sudah terlewat
    var observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        removeLoadingIndicator();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Backup safety timeout 4 detik
    setTimeout(removeLoadingIndicator, 4000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
