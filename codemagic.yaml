workflows:
  flutter-ios:
    name: MGRS iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Build iOS App
        script: |
          flutter build ios --release --no-codesign --dart-define-from-file=dart_defines.json || true
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "Checking if Runner.app was built in another directory..."
            APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
            if [ -n "$APP_PATH" ]; then
              echo "Found Runner.app at $APP_PATH, copying to build/ios/iphoneos/"
              mkdir -p build/ios/iphoneos
              cp -r "$APP_PATH" build/ios/iphoneos/
            else
              echo "Building directly with xcodebuild..."
              xcodebuild build -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
              mkdir -p build/ios/iphoneos
              cp -r build/ios/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/
            fi
          fi
          test -d "build/ios/iphoneos/Runner.app"

      - name: Package Unsigned IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr MGRS.ipa Payload

    artifacts:
      - build/ios/iphoneos/MGRS.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
