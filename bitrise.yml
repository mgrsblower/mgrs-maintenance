format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: flutter

workflows:
  primary:
    summary: Run tests
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - flutter-installer@0:
          inputs:
            - is_update: 'false'
            - version: stable
      - flutter-test@1:
          inputs:
            - project_location: .

  build-ios-unsigned:
    summary: Build unsigned iOS IPA for testing and sideloading
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - flutter-installer@0:
          inputs:
            - is_update: 'false'
            - version: stable
      - script@1:
          title: Build and Package Unsigned IPA
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -e

                echo "==> Getting packages..."
                flutter pub get

                echo "==> Building iOS app..."
                flutter build ios --release --no-codesign --dart-define-from-file=dart_defines.json || true

                if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
                  echo "Searching for Runner.app..."
                  APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
                  if [ -n "$APP_PATH" ]; then
                    echo "Found Runner.app at $APP_PATH, copying..."
                    mkdir -p build/ios/iphoneos
                    cp -r "$APP_PATH" build/ios/iphoneos/
                  else
                    echo "Building with xcodebuild..."
                    xcodebuild build -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
                    mkdir -p build/ios/iphoneos
                    cp -r build/ios/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/
                  fi
                fi

                echo "==> Packaging into unsigned IPA..."
                mkdir -p "$BITRISE_DEPLOY_DIR"
                cd build/ios/iphoneos
                mkdir -p Payload
                cp -r Runner.app Payload/
                zip -qr "$BITRISE_DEPLOY_DIR/MGRS.ipa" Payload

                echo "==> IPA successfully created at: $BITRISE_DEPLOY_DIR/MGRS.ipa"
      - deploy-to-bitrise-io@2:
          inputs:
            - deploy_path: "$BITRISE_DEPLOY_DIR"
            - is_compress: 'false'
